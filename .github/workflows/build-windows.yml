
name: Build FileFlow for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download FileFlow source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PySide6 pyinstaller

      - name: Check Python syntax
        run: |
          python -m py_compile launcher.py
          python -m py_compile app/interface.py
          python -m py_compile app/converter.py
          python -m py_compile app/pdf_converter.py

      - name: Build Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name FileFlow --paths . --add-data "assets;assets" launcher.py
      - name: Check executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FileFlow/FileFlow.exe")) {
            throw "FileFlow.exe was not created"
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: FileFlow-Windows
          path: dist/FileFlow/
          if-no-files-found: error
          retention-days: 7
