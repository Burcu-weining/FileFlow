
name: Build and Test FileFlow for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install PySide6 pyinstaller

      - name: Check Python syntax
        run: |
          python -m py_compile launcher.py
          python -m py_compile app/interface.py
          python -m py_compile app/converter.py
          python -m py_compile app/pdf_converter.py

      - name: Build windowed Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FileFlow --icon "assets/FileFlow.ico" --paths . --add-data "assets;assets" launcher.py

      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FileFlow/FileFlow.exe")) {
            throw "FileFlow.exe was not created."
          }

      - name: Test packaged Windows GUI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path "dist/FileFlow/FileFlow.exe").Path
          $report = Join-Path $env:RUNNER_TEMP "gui-smoke.txt"

          $env:FILEFLOW_TEST_REPORT = $report

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--smoke-test" `
            -PassThru

          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "GUI smoke test timed out."
          }

          $process.Refresh()

          if (Test-Path $report) {
            Get-Content $report
          } else {
            throw "GUI test report was not created."
          }

          if ($process.ExitCode -ne 0) {
            throw "GUI smoke test failed."
          }

          if ((Get-Content $report -Raw) -notmatch "SMOKE TEST PASSED") {
            throw "GUI startup was not successful."
          }

      - name: Test packaged Windows conversions
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/FileFlow/FileFlow.exe").Path
          $report = Join-Path $env:RUNNER_TEMP "conversion-smoke.txt"

          $env:FILEFLOW_TEST_REPORT = $report

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--conversion-smoke-test" `
            -PassThru

          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "Conversion smoke test timed out."
          }

          $process.Refresh()

          if (Test-Path $report) {
            Get-Content $report
          } else {
            throw "Conversion test report was not created."
          }

          if ($process.ExitCode -ne 0) {
            throw "Conversion test failed."
          }

          if ((Get-Content $report -Raw) -notmatch "ALL WINDOWS CONVERSION TESTS PASSED") {
            throw "Windows conversion checks failed."
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileFlow-Test-Reports
          path: |
            ${{ runner.temp }}/gui-smoke.txt
            ${{ runner.temp }}/conversion-smoke.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: FileFlow-Windows
          path: dist/FileFlow/
          if-no-files-found: error
          retention-days: 7
